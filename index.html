<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Placeholder metadata. Finalized in the SEO phase. -->
    <title>Ethan McKinzie | Computer Science &amp; Software Development</title>
    <meta name="description" content="Portfolio of Ethan McKinzie, a Computer Science student with an Information Technology background.">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <!-- Lets keyboard users jump straight past the navigation. -->
    <a class="skip-link" href="#main">Skip to main content</a>

    <!-- ============================================================
         HEADER / NAVIGATION
         Built in the navigation phase.
         ============================================================ -->
    <header class="site-header">
        <nav class="site-nav" aria-label="Main navigation">
            <a class="site-nav__brand" href="#top">Ethan McKinzie</a>

            <ul class="site-nav__list">
                <li><a href="#about">About</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#education">Education</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main id="main">
        <!-- ============================================================
             HERO
             ============================================================ -->
        <section id="top" class="hero" aria-labelledby="hero-heading">
            <h1 id="hero-heading">Ethan McKinzie</h1>
            <!-- Headline, intro copy, and calls-to-action added in the hero phase. -->
        </section>

        <!-- ============================================================
             ABOUT
             ============================================================ -->
        <section id="about" aria-labelledby="about-heading">
            <h2 id="about-heading">About</h2>
        </section>

        <!-- ============================================================
             PROJECTS
             Each project becomes an <article> card here, linking to a
             case-study page inside /projects/.
             ============================================================ -->
        <section id="projects" aria-labelledby="projects-heading">
            <h2 id="projects-heading">Projects</h2>
        </section>

        <!-- ============================================================
             SKILLS
             Grouped by category. No percentages or proficiency bars.
             ============================================================ -->
        <section id="skills" aria-labelledby="skills-heading">
            <h2 id="skills-heading">Skills &amp; Technologies</h2>
        </section>

        <!-- ============================================================
             EDUCATION
             ============================================================ -->
        <section id="education" aria-labelledby="education-heading">
            <h2 id="education-heading">Education</h2>
        </section>

        <!-- ============================================================
             CONTACT
             Email, GitHub, LinkedIn, and the resume link.
             ============================================================ -->
        <section id="contact" aria-labelledby="contact-heading">
            <h2 id="contact-heading">Contact</h2>
        </section>
    </main>

    <!-- ============================================================
         FOOTER
         ============================================================ -->
    <footer class="site-footer">
        <!-- The year is filled in by js/main.js so it never goes stale. -->
        <p>&copy; <span data-current-year>2026</span> Ethan McKinzie</p>
    </footer>

    <script src="js/main.js"></script>
</body>

</html>
